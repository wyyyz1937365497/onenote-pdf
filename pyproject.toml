[project]
name = "onenote-pdf"
version = "0.1.0"
description = "Export OneNote web pages through the print view on an existing X11 desktop"
requires-python = ">=3.11"
dependencies = ["playwright>=1.56,<2"]

[project.scripts]
onenote-pdf = "onenote_pdf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["onenote_pdf.py"]
